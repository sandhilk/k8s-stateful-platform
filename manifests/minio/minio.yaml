# S3-compatible object store used as the Postgres backup target (stands in for AWS S3 locally)
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: data
type: Opaque
stringData:
  ACCESS_KEY_ID: minio-local
  ACCESS_SECRET_KEY: minio-local-secret-change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: data
  labels: { app: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-creds, key: ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-creds, key: ACCESS_SECRET_KEY } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: data
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: data
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
          env:
            - name: AK
              valueFrom: { secretKeyRef: { name: minio-creds, key: ACCESS_KEY_ID } }
            - name: SK
              valueFrom: { secretKeyRef: { name: minio-creds, key: ACCESS_SECRET_KEY } }
          command: ["/bin/sh", "-c"]
          args:
            - mc alias set local http://minio.data.svc:9000 "$AK" "$SK" && mc mb --ignore-existing local/pg-backups
