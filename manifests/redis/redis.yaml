# Redis as a plain StatefulSet (no operator) to show the primitives:
# stable identity, per-pod PVC via volumeClaimTemplates, headless Service,
# AOF persistence, a PodDisruptionBudget and a metrics sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: data
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    maxmemory 200mb
    maxmemory-policy allkeys-lru
    save 900 1
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: data
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: data
  labels: { app: redis, metrics: "true" }
spec:
  selector: { app: redis }
  ports:
    - { name: metrics, port: 9121 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
spec:
  serviceName: redis-headless
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "/etc/redis/redis.conf"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/redis }
        - name: exporter
          image: oliver006/redis_exporter:v1.62.0
          ports: [{ name: metrics, containerPort: 9121 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
      volumes:
        - name: config
          configMap: { name: redis-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: data
spec:
  maxUnavailable: 0
  selector: { matchLabels: { app: redis } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: data
spec:
  selector: { matchLabels: { metrics: "true", app: redis } }
  endpoints:
    - port: metrics
      interval: 30s
