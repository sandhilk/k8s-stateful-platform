# Alerts that page for the failure modes in /runbooks
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stateful-platform-alerts
  namespace: monitoring
spec:
  groups:
    - name: postgres
      rules:
        - alert: PostgresReplicationLagHigh
          expr: max(cnpg_pg_replication_lag) > 30
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Postgres replica lag above 30s"
            runbook: "runbooks/postgres-restore.md"
        - alert: PostgresBackupStale
          expr: time() - max(cnpg_collector_last_available_backup_timestamp) > 93600
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "No successful Postgres backup in the last 26h"
            runbook: "runbooks/postgres-restore.md"
    - name: rabbitmq
      rules:
        - alert: RabbitMQQueueBacklog
          expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready) > 1000
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "RabbitMQ queue {{ $labels.queue }} has a growing backlog"
            runbook: "runbooks/rabbitmq-queue-backlog.md"
        - alert: RabbitMQMemoryAlarm
          expr: max(rabbitmq_alarms_memory_used_watermark) > 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "RabbitMQ memory alarm: publishers are being blocked"
            runbook: "runbooks/rabbitmq-queue-backlog.md"
    - name: redis
      rules:
        - alert: RedisDown
          expr: min(redis_up) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "A Redis instance is down"
            runbook: "runbooks/redis-recovery.md"
        - alert: RedisMemoryHigh
          expr: max(redis_memory_used_bytes / redis_memory_max_bytes) > 0.85
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Redis memory above 85% of maxmemory"
            runbook: "runbooks/redis-recovery.md"
